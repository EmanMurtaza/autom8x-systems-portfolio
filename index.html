    <!-- Critical CSS: dark background applied before stylesheet downloads so no white flash -->

      html, body { background: #070d1a; color: #f5f0ff; margin: 0; }
    </style>

    <title>Autom8X Systems — Web, AI & Automation</title>
    <meta name="description" content="Expert web development, AI solutions, business automation, and AI assistants." />
