<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="16" cy="16" r="15"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="#070d1a"/>
  <!-- Gradient border ring -->
  <circle cx="16" cy="16" r="15" stroke="url(#g)" stroke-width="1.5" fill="none"/>
  <!-- Outer logo ring — left of center -->
  <circle cx="11" cy="16" r="7.5" stroke="url(#g)" stroke-width="2" clip-path="url(#clip)"/>
  <!-- Inner ring accent -->
  <circle cx="11" cy="16" r="3" stroke="url(#g)" stroke-width="1.4" clip-path="url(#clip)"/>
  <!-- X mark — right of center -->
  <line x1="20" y1="10.5" x2="29" y2="21.5" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" clip-path="url(#clip)"/>
  <line x1="29" y1="10.5" x2="20" y2="21.5" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" clip-path="url(#clip)"/>
  <!-- Pixel dots top-left -->
  <rect x="2" y="2" width="2" height="2" fill="url(#g)" rx="0.3" opacity="0.5"/>
  <rect x="5" y="2" width="2" height="2" fill="url(#g)" rx="0.3" opacity="0.3"/>
  <rect x="2" y="5" width="2" height="2" fill="url(#g)" rx="0.3" opacity="0.2"/>
</svg>
